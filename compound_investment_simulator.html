<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>“买借死”与杠杆再平衡 - 高级策略回测计算器</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    .formula-section code {
      background: #eff6ff;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95rem;
      color: #1d4ed8;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  <div id="app" class="max-w-6xl mx-auto px-4 py-8">
    <!-- 顶部导航 -->
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">“买借死”与杠杆再平衡策略回测计算器</h1>
        <p class="text-gray-500 mt-1">支持自定义资产组合、定投积累、灵活提领与“买借死”杠杆风控回测 (1999-2025)</p>
      </div>
      <div class="space-x-2">
        <button @click="exportStrategyJSON" class="bg-gray-800 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition">导出策略 JSON</button>
        <button @click="triggerJSONImport" class="bg-blue-600 text-white px-3.5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">导入策略 JSON</button>
        <input type="file" ref="jsonFileInput" @change="importStrategyJSON" accept=".json" class="hidden" />
      </div>
    </div>

    <!-- 表单区 -->
    <form @submit.prevent="runStrategyBacktest" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mt-6 space-y-6">
      
      <!-- 1. 自定义资产配置 -->
      <div>
        <div class="flex justify-between items-center mb-3 border-l-4 border-blue-600 pl-2">
          <h3 class="font-bold text-gray-800 text-base">1. 自定义资产配置与目标权重</h3>
          <button type="button" @click="addAsset" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold px-2.5 py-1 rounded border border-blue-200">
            + 添加资产标的
          </button>
        </div>

        <div class="space-y-3">
          <div v-for="(asset, index) in strategy.assets" :key="index" class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
            <div class="w-1/4">
              <label class="block text-xs font-semibold text-gray-500">标的名称/代码</label>
              <input type="text" v-model="asset.name" placeholder="如 QQQ / QLD / MMF" required class="w-full px-2.5 py-1.5 mt-1 border border-gray-300 rounded text-sm bg-white outline-none focus:border-blue-500" />
            </div>
            <div class="w-1/4">
              <label class="block text-xs font-semibold text-gray-500">目标权重 (%)</label>
              <input type="number" v-model.number="asset.weight" min="0" max="100" step="1" required class="w-full px-2.5 py-1.5 mt-1 border border-gray-300 rounded text-sm bg-white outline-none focus:border-blue-500" />
            </div>
            <div class="w-1/3">
              <label class="block text-xs font-semibold text-gray-500">资产类型 / 收益来源</label>
              <select v-model="asset.type" class="w-full px-2.5 py-1.5 mt-1 border border-gray-300 rounded text-sm bg-white outline-none focus:border-blue-500">
                <option value="historical_qqq">100% 纳指 (QQQ 真实历史数据)</option>
                <option value="historical_qld">2x 杠杆纳指 (QLD 真实历史数据)</option>
                <option value="historical_tqqq">3x 杠杆纳指 (TQQQ 真实历史数据)</option>
                <option value="fixed_mmf">固定收益现金/货基 (MMF)</option>
              </select>
            </div>
            <div class="w-1/6" v-if="asset.type === 'fixed_mmf'">
              <label class="block text-xs font-semibold text-gray-500">固定年化 (%)</label>
              <input type="number" v-model.number="asset.fixedRate" step="0.1" class="w-full px-2.5 py-1.5 mt-1 border border-gray-300 rounded text-sm bg-white outline-none focus:border-blue-500" />
            </div>
            <div class="pt-5">
              <button type="button" @click="removeAsset(index)" :disabled="strategy.assets.length <= 1" class="text-red-500 hover:text-red-700 text-xs font-semibold disabled:opacity-30">
                删除
              </button>
            </div>
          </div>
        </div>
        <p class="text-xs mt-2" :class="totalWeight === 100 ? 'text-gray-400' : 'text-red-500 font-semibold'">
          当前权重总和：{{ totalWeight }}%（目标必须恰好等于 100%）
        </p>
      </div>

      <!-- 2. 定投 (DCA) 设置 -->
      <div>
        <h3 class="font-bold text-gray-800 text-base mb-3 border-l-4 border-teal-600 pl-2">2. 定投积累配置 (DCA)</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700">是否开启定期追加投</label>
            <select v-model="strategy.dca.enabled" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option :value="false">关闭定投 (仅初始资金)</option>
              <option :value="true">开启定投</option>
            </select>
          </div>
          <div v-if="strategy.dca.enabled">
            <label class="block text-sm font-semibold text-gray-700">每年定投金额（元/$）</label>
            <input type="number" v-model.number="strategy.dca.annualAmount" min="0" step="1000" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
          <div v-if="strategy.dca.enabled">
            <label class="block text-sm font-semibold text-gray-700">定投时间节点</label>
            <select v-model="strategy.dca.timing" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option value="beginning">每年年初定投并再平衡</option>
              <option value="end">每年年末定投</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 3. 提领策略配置 -->
      <div>
        <h3 class="font-bold text-gray-800 text-base mb-3 border-l-4 border-indigo-600 pl-2">3. 提领与再平衡策略配置</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700">提领模式</label>
            <select v-model="strategy.withdrawal.mode" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option value="none">不提领 (纯积累期)</option>
              <option value="buy_borrow_die">买借死 (抵押股票借贷提领)</option>
              <option value="sell_off">按比例变卖资产提领</option>
            </select>
          </div>
          <div v-if="strategy.withdrawal.mode !== 'none'">
            <label class="block text-sm font-semibold text-gray-700">提领计算方式</label>
            <select v-model="strategy.withdrawal.type" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option value="fixed">固定金额提领</option>
              <option value="percent">按当年总资产百分比 (%)</option>
            </select>
          </div>
          <div v-if="strategy.withdrawal.mode !== 'none' && strategy.withdrawal.type === 'fixed'">
            <label class="block text-sm font-semibold text-gray-700">每年固定提领金额（元/$）</label>
            <input type="number" v-model.number="strategy.withdrawal.fixedAmount" min="0" step="1000" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
          <div v-if="strategy.withdrawal.mode !== 'none' && strategy.withdrawal.type === 'percent'">
            <label class="block text-sm font-semibold text-gray-700">每年提领总资产比例 (%)</label>
            <input type="number" v-model.number="strategy.withdrawal.percentRate" min="0" max="100" step="0.5" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
        </div>
      </div>

      <!-- 4. 买借死风控参数 (仅买借死模式有效) -->
      <div v-if="strategy.withdrawal.mode === 'buy_borrow_die'">
        <h3 class="font-bold text-gray-800 text-base mb-3 border-l-4 border-amber-500 pl-2">4. “买借死”借贷利率与 LTV 风控设置</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700">借贷年利率 (Margin Rate %)</label>
            <input type="number" v-model.number="strategy.margin.borrowRate" min="0" step="0.1" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">LTV 安全/警戒线 (%)</label>
            <input type="number" v-model.number="strategy.margin.warningLTV" min="10" max="80" step="1" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">LTV 强制平仓线 (%)</label>
            <input type="number" v-model.number="strategy.margin.liquidationLTV" min="20" max="90" step="1" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">触及警戒线应对策略</label>
            <select v-model="strategy.margin.defensiveStrategy" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option value="use_cash">优先消耗现金/货基等无杠杆资产</option>
              <option value="pause">暂停当期提领，保护资产</option>
              <option value="passive">无视警戒线，直至强平</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 5. 全局回测参数 -->
      <div>
        <h3 class="font-bold text-gray-800 text-base mb-3 border-l-4 border-emerald-600 pl-2">5. 初始资本与时间区间</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700">初始总资产（元/$）</label>
            <input type="number" v-model.number="strategy.config.initialCapital" min="0" step="10000" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">开始年份</label>
            <select v-model="strategy.config.startYear" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option v-for="y in availableYears" :key="y" :value="y">{{ y }} 年</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">结束年份</label>
            <select v-model="strategy.config.endYear" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
              <option v-for="y in availableYears" :key="'end-'+y" :value="y" :disabled="y < strategy.config.startYear">{{ y }} 年</option>
            </select>
          </div>
        </div>
      </div>

      <div class="pt-2 flex gap-3">
        <button type="submit" class="bg-blue-600 text-white px-8 py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition shadow">执行策略回测</button>
        <button type="button" v-if="results.length" @click="exportCSV" class="bg-emerald-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition shadow">导出数据 CSV</button>
      </div>
    </form>

    <!-- 回测结果展示区 -->
    <template v-if="results.length">
      <!-- 核心指标统计 -->
      <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mt-8">
        <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-blue-500">
          <div class="text-xs text-gray-500">期末净资产 (Net Worth)</div>
          <div class="text-xl font-bold mt-1" :class="summary.finalNetWorth >= 0 ? 'text-gray-900' : 'text-red-600'">{{ fmtMoney(summary.finalNetWorth) }}</div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-teal-500">
          <div class="text-xs text-gray-500">累计投入资金 (初始+定投)</div>
          <div class="text-xl font-bold mt-1 text-teal-600">{{ fmtMoney(summary.totalInvested) }}</div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-indigo-500">
          <div class="text-xs text-gray-500">累计已提领现金</div>
          <div class="text-xl font-bold mt-1 text-indigo-600">{{ fmtMoney(summary.totalWithdrawn) }}</div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-amber-500">
          <div class="text-xs text-gray-500">期末总债务 (Margin Debt)</div>
          <div class="text-xl font-bold mt-1 text-amber-600">{{ fmtMoney(summary.finalDebt) }}</div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-emerald-500">
          <div class="text-xs text-gray-500">最高 LTV 峰值 / 年化 CAGR</div>
          <div class="text-xl font-bold mt-1 text-emerald-600">
            <span v-if="strategy.withdrawal.mode === 'buy_borrow_die'" :class="summary.maxLTV > strategy.margin.warningLTV / 100 ? 'text-red-500' : ''">
              {{ (summary.maxLTV * 100).toFixed(1) }}% |
            </span>
            {{ (summary.cagr * 100).toFixed(2) }}%
          </div>
        </div>
      </div>

      <!-- 资产与债务走势图 -->
      <div class="bg-white rounded-xl shadow-sm p-5 mt-6 border border-gray-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-gray-800">总资产、总债务与净资产走势</h3>
          <span class="text-xs text-gray-400">蓝线：股票总市值 | 绿线：净资产 | 橙虚线：Margin 债务</span>
        </div>
        <div class="relative h-80">
          <canvas id="wealthChart"></canvas>
        </div>
      </div>

      <!-- LTV 风险监控图 -->
      <div v-if="strategy.withdrawal.mode === 'buy_borrow_die'" class="bg-white rounded-xl shadow-sm p-5 mt-6 border border-gray-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-gray-800">LTV (借贷比例) 风险监控图</h3>
          <span class="text-xs text-gray-400">黄虚线：警戒线 ({{ strategy.margin.warningLTV }}%) | 红虚线：平仓线 ({{ strategy.margin.liquidationLTV }}%)</span>
        </div>
        <div class="relative h-60">
          <canvas id="ltvChart"></canvas>
        </div>
      </div>

      <!-- 逐年明细表格 -->
      <div class="mt-6 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-4 bg-gray-50 border-b font-bold text-gray-700">年度策略回测运行明细</div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-800 text-white">
              <tr>
                <th class="px-3 py-2.5 text-center">年份</th>
                <th class="px-3 py-2.5 text-right" v-for="a in strategy.assets" :key="a.name">{{ a.name }} 市值</th>
                <th class="px-3 py-2.5 text-right">总资产价值</th>
                <th class="px-3 py-2.5 text-right">累计债务</th>
                <th class="px-3 py-2.5 text-right">净资产</th>
                <th class="px-3 py-2.5 text-center" v-if="strategy.withdrawal.mode === 'buy_borrow_die'">LTV (%)</th>
                <th class="px-3 py-2.5 text-right">当年定投投入</th>
                <th class="px-3 py-2.5 text-right">当年提领现金</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="item in results" :key="item.year" class="border-b border-gray-100 hover:bg-gray-50">
                <td class="px-3 py-2 text-center font-semibold">{{ item.year }}</td>
                <td class="px-3 py-2 text-right" v-for="(v, idx) in item.assetValues" :key="idx">{{ fmtMoney(v) }}</td>
                <td class="px-3 py-2 text-right font-medium text-blue-600">{{ fmtMoney(item.totalAssetValue) }}</td>
                <td class="px-3 py-2 text-right text-amber-600">{{ fmtMoney(item.debt) }}</td>
                <td class="px-3 py-2 text-right font-bold" :class="item.netWorth >= 0 ? 'text-gray-900' : 'text-red-600'">{{ fmtMoney(item.netWorth) }}</td>
                <td v-if="strategy.withdrawal.mode === 'buy_borrow_die'" class="px-3 py-2 text-center font-semibold" :class="item.ltv > strategy.margin.warningLTV / 100 ? 'text-red-500' : 'text-emerald-600'">
                  {{ (item.ltv * 100).toFixed(1) }}%
                </td>
                <td class="px-3 py-2 text-right text-teal-600">{{ fmtMoney(item.dcaIn) }}</td>
                <td class="px-3 py-2 text-right text-indigo-600">{{ fmtMoney(item.withdrawn) }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>

  <!-- 历史标的年度收益率数据 (1999-2025) -->
  <script>
    var historicalReturns = {
      1999: { qqq: 1.019, qld: 2.10, tqqq: 3.20 },
      2000: { qqq: -0.368, qld: -0.65, tqqq: -0.88 },
      2001: { qqq: -0.327, qld: -0.60, tqqq: -0.80 },
      2002: { qqq: -0.376, qld: -0.68, tqqq: -0.85 },
      2003: { qqq: 0.497, qld: 1.10, tqqq: 1.80 },
      2004: { qqq: 0.104, qld: 0.20, tqqq: 0.32 },
      2005: { qqq: 0.016, qld: 0.02, tqqq: 0.02 },
      2006: { qqq: 0.071, qld: 0.13, tqqq: 0.20 },
      2007: { qqq: 0.190, qld: 0.38, tqqq: 0.60 },
      2008: { qqq: -0.419, qld: -0.72, tqqq: -0.92 },
      2009: { qqq: 0.547, qld: 1.25, tqqq: 2.10 },
      2010: { qqq: 0.192, qld: 0.38, tqqq: 0.58 },
      2011: { qqq: 0.034, qld: 0.04, tqqq: 0.02 },
      2012: { qqq: 0.181, qld: 0.36, tqqq: 0.56 },
      2013: { qqq: 0.366, qld: 0.82, tqqq: 1.40 },
      2014: { qqq: 0.192, qld: 0.38, tqqq: 0.58 },
      2015: { qqq: 0.097, qld: 0.17, tqqq: 0.26 },
      2016: { qqq: 0.071, qld: 0.12, tqqq: 0.18 },
      2017: { qqq: 0.327, qld: 0.71, tqqq: 1.18 },
      2018: { qqq: -0.001, qld: -0.06, tqqq: -0.19 },
      2019: { qqq: 0.391, qld: 0.88, tqqq: 1.42 },
      2020: { qqq: 0.486, qld: 1.08, tqqq: 1.85 },
      2021: { qqq: 0.274, qld: 0.58, tqqq: 0.83 },
      2022: { qqq: -0.326, qld: -0.60, tqqq: -0.79 },
      2023: { qqq: 0.548, qld: 1.22, tqqq: 1.98 },
      2024: { qqq: 0.250, qld: 0.52, tqqq: 0.82 },
      2025: { qqq: 0.180, qld: 0.36, tqqq: 0.55 }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    new Vue({
      el: '#app',
      data: function() {
        return {
          availableYears: Object.keys(historicalReturns).map(Number).sort(function(a, b) { return a - b; }),
          strategy: {
            assets: [
              { name: 'QQQ (1x)', weight: 40, type: 'historical_qqq', fixedRate: 0 },
              { name: 'QLD (2x)', weight: 30, type: 'historical_qld', fixedRate: 0 },
              { name: 'MMF 现金', weight: 30, type: 'fixed_mmf', fixedRate: 4.5 }
            ],
            dca: {
              enabled: false,
              annualAmount: 20000,
              timing: 'beginning'
            },
            withdrawal: {
              mode: 'buy_borrow_die',
              type: 'fixed',
              fixedAmount: 40000,
              percentRate: 4.0
            },
            margin: {
              borrowRate: 5.5,
              warningLTV: 45,
              liquidationLTV: 65,
              defensiveStrategy: 'use_cash'
            },
            config: {
              initialCapital: 1000000,
              startYear: 1999,
              endYear: 2025
            }
          },
          results: [],
          wealthChart: null,
          ltvChart: null
        };
      },
      computed: {
        totalWeight: function() {
          return this.strategy.assets.reduce(function(sum, a) { return sum + (Number(a.weight) || 0); }, 0);
        },
        summary: function() {
          if (!this.results.length) return {};
          var last = this.results[this.results.length - 1];
          var maxLTV = 0;
          var totalWithdrawn = 0;
          var totalInvested = this.strategy.config.initialCapital;

          this.results.forEach(function(r) {
            if (r.ltv > maxLTV) maxLTV = r.ltv;
            totalWithdrawn += r.withdrawn;
            totalInvested += r.dcaIn;
          });

          var years = this.strategy.config.endYear - this.strategy.config.startYear + 1;
          var ratio = last.netWorth > 0 ? (last.netWorth / totalInvested) : 0;
          var cagr = ratio > 0 ? Math.pow(ratio, 1 / years) - 1 : -1;

          return {
            finalNetWorth: last.netWorth,
            finalDebt: last.debt,
            totalWithdrawn: totalWithdrawn,
            totalInvested: totalInvested,
            maxLTV: maxLTV,
            cagr: cagr
          };
        }
      },
      methods: {
        addAsset: function() {
          this.strategy.assets.push({
            name: '新资产 ' + (this.strategy.assets.length + 1),
            weight: 0,
            type: 'historical_qqq',
            fixedRate: 3.0
          });
        },
        removeAsset: function(index) {
          this.strategy.assets.splice(index, 1);
        },
        fmtMoney: function(num) {
          if (typeof num !== 'number' || isNaN(num)) return '0.00';
          var abs = Math.abs(num);
          if (abs >= 100000000) return (num / 100000000).toFixed(2) + '亿';
          if (abs >= 10000) return (num / 10000).toFixed(2) + '万';
          return num.toFixed(2);
        },
        getReturnForAsset: function(asset, year) {
          var data = historicalReturns[year] || { qqq: 0.08, qld: 0.16, tqqq: 0.24 };
          if (asset.type === 'historical_qqq') return data.qqq;
          if (asset.type === 'historical_qld') return data.qld;
          if (asset.type === 'historical_tqqq') return data.tqqq;
          if (asset.type === 'fixed_mmf') return (asset.fixedRate || 0) / 100;
          return 0;
        },
        runStrategyBacktest: function() {
          if (this.totalWeight !== 100) {
            alert('资产配置目标权重之和必须恰好等于 100%');
            return;
          }

          var start = this.strategy.config.startYear;
          var end = this.strategy.config.endYear;
          var initCap = this.strategy.config.initialCapital;

          // 初始各资产金额
          var currentAssetValues = this.strategy.assets.map(function(a) {
            return initCap * (a.weight / 100);
          });

          var debt = 0;
          var res = [];

          for (var y = start; y <= end; y++) {
            var dcaAddedThisYear = 0;

            // 1. 年初定投逻辑
            if (this.strategy.dca.enabled && this.strategy.dca.timing === 'beginning') {
              dcaAddedThisYear = this.strategy.dca.annualAmount;
              for (var i = 0; i < currentAssetValues.length; i++) {
                currentAssetValues[i] += dcaAddedThisYear * (this.strategy.assets[i].weight / 100);
              }
            }

            // 2. 各资产根据当年市场收益增长
            for (var i = 0; i < currentAssetValues.length; i++) {
              var ret = this.getReturnForAsset(this.strategy.assets[i], y);
              currentAssetValues[i] *= (1 + ret);
            }

            // 债务计息
            if (debt > 0) {
              debt *= (1 + (this.strategy.margin.borrowRate / 100));
            }

            // 年末定投逻辑
            if (this.strategy.dca.enabled && this.strategy.dca.timing === 'end') {
              dcaAddedThisYear = this.strategy.dca.annualAmount;
              for (var i = 0; i < currentAssetValues.length; i++) {
                currentAssetValues[i] += dcaAddedThisYear * (this.strategy.assets[i].weight / 100);
              }
            }

            var totalAssetVal = currentAssetValues.reduce(function(sum, v) { return sum + v; }, 0);
            var currentLTV = totalAssetVal > 0 ? (debt / totalAssetVal) : 0;
            var actualWithdrawn = 0;

            // 3. 计算本期目标提领金额 (固定金额 vs 百分比)
            var targetWithdrawal = 0;
            if (this.strategy.withdrawal.mode !== 'none') {
              if (this.strategy.withdrawal.type === 'fixed') {
                targetWithdrawal = this.strategy.withdrawal.fixedAmount;
              } else {
                targetWithdrawal = totalAssetVal * (this.strategy.withdrawal.percentRate / 100);
              }
            }

            // 4. 风控与“买借死”提领处理
            var warningThreshold = this.strategy.margin.warningLTV / 100;
            var liquidationThreshold = this.strategy.margin.liquidationLTV / 100;

            // 强平检查
            if (this.strategy.withdrawal.mode === 'buy_borrow_die' && currentLTV >= liquidationThreshold) {
              var targetDebt = totalAssetVal * warningThreshold;
              var payAmount = debt - targetDebt;
              debt -= payAmount;
              totalAssetVal -= payAmount;
              var scale = totalAssetVal > 0 ? (totalAssetVal / (totalAssetVal + payAmount)) : 0;
              currentAssetValues = currentAssetValues.map(function(v) { return v * scale; });
            }

            // 执行提领
            if (this.strategy.withdrawal.mode === 'buy_borrow_die') {
              currentLTV = totalAssetVal > 0 ? (debt / totalAssetVal) : 0;
              if (currentLTV >= warningThreshold) {
                if (this.strategy.margin.defensiveStrategy === 'use_cash') {
                  // 寻找 MMF/现金类无杠杆资产优先扣除
                  var cashIndex = this.strategy.assets.findIndex(function(a) { return a.type === 'fixed_mmf'; });
                  if (cashIndex !== -1 && currentAssetValues[cashIndex] >= targetWithdrawal) {
                    currentAssetValues[cashIndex] -= targetWithdrawal;
                    actualWithdrawn = targetWithdrawal;
                  } else {
                    debt += targetWithdrawal;
                    actualWithdrawn = targetWithdrawal;
                  }
                } else if (this.strategy.margin.defensiveStrategy === 'pause') {
                  actualWithdrawn = 0; // 暂停提领
                } else {
                  debt += targetWithdrawal;
                  actualWithdrawn = targetWithdrawal;
                }
              } else {
                debt += targetWithdrawal;
                actualWithdrawn = targetWithdrawal;
              }
            } else if (this.strategy.withdrawal.mode === 'sell_off') {
              actualWithdrawn = targetWithdrawal;
              if (totalAssetVal >= targetWithdrawal) {
                var withdrawScale = (totalAssetVal - targetWithdrawal) / totalAssetVal;
                currentAssetValues = currentAssetValues.map(function(v) { return v * withdrawScale; });
              } else {
                currentAssetValues = currentAssetValues.map(function() { return 0; });
              }
            }

            // 5. 执行组合再平衡 (按照配置的目标权重重新归位)
            var finalTotalAsset = currentAssetValues.reduce(function(sum, v) { return sum + v; }, 0);
            if (finalTotalAsset > 0) {
              for (var i = 0; i < currentAssetValues.length; i++) {
                currentAssetValues[i] = finalTotalAsset * (this.strategy.assets[i].weight / 100);
              }
            }

            var netWorth = finalTotalAsset - debt;
            var finalLTV = finalTotalAsset > 0 ? (debt / finalTotalAsset) : 0;

            res.push({
              year: y,
              assetValues: currentAssetValues.slice(),
              totalAssetValue: finalTotalAsset,
              debt: debt,
              netWorth: netWorth,
              ltv: finalLTV,
              dcaIn: dcaAddedThisYear,
              withdrawn: actualWithdrawn
            });
          }

          this.results = res;
          this.$nextTick(function() {
            this.renderWealthChart();
            this.renderLTVChart();
          }.bind(this));
        },
        renderWealthChart: function() {
          var canvas = document.getElementById('wealthChart');
          if (!canvas) return;
          if (this.wealthChart) this.wealthChart.destroy();

          var years = this.results.map(function(r) { return r.year; });
          var stocks = this.results.map(function(r) { return Number(r.totalAssetValue.toFixed(2)); });
          var debts = this.results.map(function(r) { return Number(r.debt.toFixed(2)); });
          var netWorths = this.results.map(function(r) { return Number(r.netWorth.toFixed(2)); });

          this.wealthChart = new Chart(canvas, {
            type: 'line',
            data: {
              labels: years,
              datasets: [
                { label: '总资产价值', data: stocks, borderColor: '#2563eb', fill: false, borderWidth: 2, pointRadius: 0 },
                { label: '净资产 (Net Worth)', data: netWorths, borderColor: '#10b981', fill: false, borderWidth: 2, pointRadius: 0 },
                { label: 'Margin 债务', data: debts, borderColor: '#f59e0b', borderDash: [4, 4], fill: false, borderWidth: 1.5, pointRadius: 0 }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        },
        renderLTVChart: function() {
          var canvas = document.getElementById('ltvChart');
          if (!canvas) return;
          if (this.ltvChart) this.ltvChart.destroy();

          var years = this.results.map(function(r) { return r.year; });
          var ltvs = this.results.map(function(r) { return Number((r.ltv * 100).toFixed(2)); });
          var warningLine = Array(years.length).fill(this.strategy.margin.warningLTV);
          var liqLine = Array(years.length).fill(this.strategy.margin.liquidationLTV);

          this.ltvChart = new Chart(canvas, {
            type: 'line',
            data: {
              labels: years,
              datasets: [
                { label: '实际 LTV (%)', data: ltvs, borderColor: '#8b5cf6', backgroundColor: 'rgba(139, 92, 246, 0.1)', fill: true, borderWidth: 2 },
                { label: '警戒线 (%)', data: warningLine, borderColor: '#f59e0b', borderDash: [4, 4], fill: false, pointRadius: 0 },
                { label: '平仓线 (%)', data: liqLine, borderColor: '#ef4444', borderDash: [2, 2], fill: false, pointRadius: 0 }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
          });
        },
        exportStrategyJSON: function() {
          var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.strategy, null, 2));
          var a = document.createElement('a');
          a.setAttribute("href", dataStr);
          a.setAttribute("download", "strategy_config.json");
          document.body.appendChild(a);
          a.click();
          a.remove();
        },
        triggerJSONImport: function() {
          this.$refs.jsonFileInput.click();
        },
        importStrategyJSON: function(e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          var self = this;
          reader.onload = function(evt) {
            try {
              var obj = JSON.parse(evt.target.result);
              self.strategy = obj;
              alert('策略配置导入成功！');
            } catch (err) {
              alert('JSON 格式不正确');
            }
          };
          reader.readAsText(file);
        },
        exportCSV: function() {
          if (!this.results.length) return;
          var assetHeaders = this.strategy.assets.map(function(a) { return a.name + '市值'; });
          var headers = ['年份'].concat(assetHeaders).concat(['总资产价值', '累计债务', '净资产', 'LTV(%)', '当年定投', '当年提领']);
          
          var rows = this.results.map(function(r) {
            var vals = r.assetValues.map(function(v) { return v.toFixed(2); });
            return [r.year].concat(vals).concat([
              r.totalAssetValue.toFixed(2),
              r.debt.toFixed(2),
              r.netWorth.toFixed(2),
              (r.ltv * 100).toFixed(2),
              r.dcaIn.toFixed(2),
              r.withdrawn.toFixed(2)
            ]);
          });

          var csv = headers.join(',') + '\r\n';
          rows.forEach(function(row) { csv += row.join(',') + '\r\n'; });
          var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = '回测策略明细.csv';
          a.click();
        }
      },
      mounted: function() {
        this.runStrategyBacktest();
      }
    });
  </script>
</body>
</html>

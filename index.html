<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ETF 投资计算工具箱</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  <div id="app" class="flex-1">
    <!-- 标题栏 -->
    <header class="max-w-5xl mx-auto px-4 pt-8 pb-6">
      <h1 class="text-2xl font-bold">ETF 投资计算工具箱</h1>
      <p class="text-gray-500 mt-1">一站式 ETF 投资计算与回测工具</p>
    </header>

    <!-- 分组计算器卡片网格 -->
    <main class="max-w-5xl mx-auto px-4 pb-8 space-y-8">
      <section v-for="category in calculatorCategories" :key="category.title">
        <!-- 分组标题 -->
        <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center">
          <span class="mr-2">{{ category.icon }}</span>
          <span>{{ category.title }}</span>
          <span class="ml-2 text-xs font-normal text-gray-400">({{ category.items.length }})</span>
        </h2>
        <!-- 计算器卡片列表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <a v-for="item in category.items" :key="item.file"
             :href="item.file"
             target="_blank" rel="noopener noreferrer"
             class="block bg-white rounded-lg shadow hover:shadow-md border-l-4 p-5 transition-shadow duration-200 no-underline"
             :class="category.borderColor">
            <h3 class="text-base font-semibold text-gray-800">{{ item.name }}</h3>
            <p class="text-sm text-gray-500 mt-1 line-clamp-2">{{ item.desc }}</p>
          </a>
        </div>
      </section>
    </main>

    <!-- 投资文章 -->
    <section class="max-w-5xl mx-auto px-4 pb-8">
      <div class="border-t border-gray-200 pt-6">
        <h2 class="text-lg font-bold mb-3 text-gray-800 flex items-center">
          <span class="mr-2">📚</span>
          <span>投资文章</span>
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <a v-for="item in articleItems" :key="item.file"
             :href="item.file"
             target="_blank" rel="noopener noreferrer"
             class="block bg-white rounded-lg shadow hover:shadow-md border-l-4 border-green-400 p-5 transition-shadow duration-200 no-underline">
            <h3 class="text-base font-semibold text-gray-800">{{ item.name }}</h3>
            <p class="text-sm text-gray-500 mt-1">{{ item.desc }}</p>
          </a>
        </div>
      </div>
    </section>

    <!-- 外部资源 -->
    <section class="max-w-5xl mx-auto px-4 pb-8">
      <div class="border-t border-gray-200 pt-6">
        <h2 class="text-lg font-bold mb-3 text-gray-800 flex items-center">
          <span class="mr-2">🔗</span>
          <span>外部资源</span>
        </h2>
        <ul class="space-y-2">
          <li v-for="link in externalLinks" :key="link.url">
            <a :href="link.url" target="_blank" rel="noopener noreferrer"
               class="text-blue-600 hover:text-blue-800 hover:underline inline-flex items-center">
              <span>{{ link.name }}</span>
              <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="text-center text-gray-400 text-sm py-6 border-t border-gray-200 max-w-5xl mx-auto px-4">
      &copy; 2025 Summerson Kiritani
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/3.10.1/lodash.min.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: {
        calculatorCategories: [
          {
            title: '定投与复利规划',
            icon: '📈',
            borderColor: 'border-blue-400',
            items: [
              { name: '复利定投计算器', file: 'calculators/compound_investment_calculator.html', desc: '计算定期定额投资的复利收益与提领' },
              { name: '复利定投回测计算器', file: 'calculators/compound_investment_backtest.html', desc: '基于历史数据回测定投策略收益' },
              { name: '复利定投资产提领计算器', file: 'calculators/compound_investment_simulator.html', desc: '模拟定投积累后的资产提领方案' }
            ]
          },
          {
            title: '资产配置与组合',
            icon: '⚖️',
            borderColor: 'border-indigo-400',
            items: [
              { name: '资产配置计算器', file: 'calculators/asset_allocation_calculator.html', desc: '按比例分配不同资产类别的投资金额' },
              { name: '资产再平衡计算器', file: 'calculators/asset_rebalancing_calculator.html', desc: '计算资产偏离目标比例后的再平衡方案' },
              { name: '投资组合 Beta 计算器', file: 'calculators/investment_portfolio_beta_calculator.html', desc: '计算投资组合相对于基准的 Beta 系数' }
            ]
          },
          {
            title: '杠杆与融资风控',
            icon: '⚡',
            borderColor: 'border-red-400',
            items: [
              { name: '杠杆计算器', file: 'calculators/leverage_calculator.html', desc: '计算杠杆交易后的盈亏金额' },
              { name: '维持率 & LTV 计算器', file: 'calculators/retention_and_ltv_calculator.html', desc: '计算融资账户维持率与贷款价值比' },
              { name: '净孖展比率计算器', file: 'calculators/wealth_portfolio_lending_calculator.html', desc: '计算投资组合净孖展比率' },
              { name: '混合信贷率计算器', file: 'calculators/mixed_ltv_calculator.html', desc: '计算多品种混合持仓的信贷率' },
              { name: '贷款与投资对比计算器', file: 'calculators/loan_vs_investment_calculator.html', desc: '对比贷款投资与直接投资的差异' }
            ]
          },
          {
            title: '收益与策略分析',
            icon: '📊',
            borderColor: 'border-purple-400',
            items: [
              { name: '投资收益率计算器', file: 'calculators/investment_profit_rate_calculator.html', desc: '计算投资的总收益率与年化收益率' },
              { name: '折价投资计算器', file: 'calculators/discount_investment_calculator.html', desc: '计算折价买入的投资成本与收益' },
              { name: '模拟涨跌计算器', file: 'calculators/stock_change_sequence_calculator.html', desc: '模拟股票价格的随机涨跌序列' }
            ]
          },
          {
            title: '综合与人生规划',
            icon: '🏡',
            borderColor: 'border-amber-400',
            items: [
              { name: '房产租售比计算器', file: 'calculators/rent_sale_ratio_calculator.html', desc: '计算房产租售比、年化收益率与回本年限' },
              { name: '人生倒计时', file: 'calculators/life_countdown.html', desc: '可视化人生剩余时间倒计时' }
            ]
          }
        ],
        articleItems: [
          { name: 'CLEC 投资哲学', file: 'articles/clec_investment_philosophy.html', desc: 'Beta + Alpha 个人财富增长战略模型' },
          { name: '长寿金字塔与行动清单', file: 'articles/longevity_checklist.html', desc: '健康长寿的分层策略与完整行动清单' }
        ],
        externalLinks: [
          { name: 'QQQ/QLD 回测工具', url: 'https://clec-strategy-backtest.vercel.app' },
          { name: 'Investing.com 香港 - 股市報價 & 財經新聞', url: 'https://hk.investing.com' },
          { name: '雪球 - 聪明的投资者都在这里', url: 'https://xueqiu.com' }
        ]
      }
    });
  </script>
</body>
</html>
